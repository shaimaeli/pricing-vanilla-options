<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pricing d'options</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #f3f6fb; color: #14223b; }

  /* ---------- header : données de marché ---------- */
  header { background: #0b2a5b; color: white; padding: 14px 28px 12px; }
  .titre { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
  .barre { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .champ label { display: block; font-size: 10px; color: #a9bde0; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 3px; }
  .champ input, .champ select { padding: 7px 8px; border: 0; border-radius: 6px; background: white; color: #14223b; font-size: 13px; }
  .champ input[readonly] { background: #e1eafa; font-weight: 600; }
  .champ .ligne { display: flex; gap: 6px; }
  #ticker { width: 90px; text-transform: uppercase; }
  #expiration { width: 125px; }
  #type { width: 75px; }
  #k, #s0, #sigma { width: 95px; }
  #t, #r, #q { width: 80px; }
  .champ button { padding: 7px 14px; border: 0; border-radius: 6px; background: #3a6fd8; color: white; font-weight: 600; cursor: pointer; }
  .champ button:hover { background: #4f82ea; }
  #info { font-size: 12px; color: #ffd166; min-height: 16px; margin-top: 8px; }
  #info.ok { color: #a9bde0; }

  /* ---------- onglets ---------- */
  nav { display: flex; gap: 4px; padding: 14px 28px 0; border-bottom: 2px solid #d9e2f0; background: #f3f6fb; }
  nav button { padding: 10px 20px; border: 0; background: transparent; color: #5b6b86; font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  nav button:hover { color: #0b2a5b; }
  nav button.actif { color: #0b2a5b; font-weight: 700; border-bottom-color: #0b2a5b; }

  main { padding: 20px 28px 40px; }
  .panneau { display: none; }
  .panneau.actif { display: block; }
  .controles { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .controles label { display: block; font-size: 11px; color: #5b6b86; margin-bottom: 3px; }
  .controles input, .controles select { padding: 7px 8px; border: 1px solid #c4d1e6; border-radius: 6px; font-size: 13px; width: 100px; }
  .controles select { width: 120px; }
  .bouton { padding: 9px 20px; background: #0b2a5b; color: white; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
  .bouton:hover { background: #023a93; }
  .erreur { color: #c0392b; margin: 16px 0 0; }
  .info { color: #5b6b86; font-size: 13px; margin: 18px 0 0; }

  /* ---------- résultats ---------- */
  h3 { margin: 26px 0 10px; font-size: 12px; color: #0b2a5b; text-transform: uppercase; letter-spacing: 1px; }
  .grille { display: flex; gap: 12px; flex-wrap: wrap; }
  .cartec { background: white; border: 1px solid #d9e2f0; border-left: 4px solid #0b2a5b; border-radius: 10px; padding: 12px 18px; min-width: 170px; }
  .cartec.ok { border-left-color: #1e8e5a; }
  .cartec.bad { border-left-color: #c0392b; }
  .cartec .lab { font-size: 11px; color: #5b6b86; text-transform: uppercase; letter-spacing: .5px; }
  .cartec .val { font-size: 24px; font-weight: 700; color: #0b2a5b; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .defil { max-height: 440px; overflow: auto; border: 1px solid #d9e2f0; border-radius: 8px; background: white; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { background: #0b2a5b; color: white; padding: 9px 12px; text-align: right; font-weight: 600; position: sticky; top: 0; white-space: nowrap; }
  table.t td { padding: 8px 12px; border-bottom: 1px solid #e3eaf5; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.t th:first-child, table.t td:first-child { text-align: left; }
  table.t tbody tr:nth-child(even) td { background: #f7f9fd; }
  table.t tbody tr.hl td { background: #dde8fb; font-weight: 700; }
  table.t tbody tr.ok td { background: #e6f5ee; }
  table.t tbody tr.bad td { background: #fbeaea; }
  table.t tbody tr.note td { white-space: normal; }
  table.t tbody tr.note td:last-child { text-align: left; }

  .arbre { overflow: auto; border: 1px solid #d9e2f0; border-radius: 8px; }
  .graphe-large { overflow: auto; }
</style>
</head>
<body>

<header>
  <div class="titre">Pricing d'options</div>
  <div class="barre">
    <div class="champ"><label>Ticker</label>
      <div class="ligne"><input id="ticker" value="AAPL"><button onclick="chargerTicker()">Charger</button></div></div>
    <div class="champ"><label>Type</label>
      <select id="type" onchange="majVol()"><option value="call">Call</option><option value="put">Put</option></select></div>
    <div class="champ"><label>Échéance</label><select id="expiration" onchange="changerEcheance()"></select></div>
    <div class="champ"><label>Strike K</label>
      <input id="k" type="number" step="any" list="liste_strikes" oninput="majVolDiffere()" onchange="majVol()">
      <datalist id="liste_strikes"></datalist></div>
    <div class="champ"><label>Spot S0</label><input id="s0" type="number" readonly></div>
    <div class="champ"><label>T (années)</label><input id="t" type="number" readonly></div>
    <div class="champ"><label>Taux r</label><input id="r" type="number" step="any" oninput="majVolDiffere()"></div>
    <div class="champ"><label>Dividende q</label><input id="q" type="number" step="any" min="0" value="0" oninput="majVolDiffere()"></div>
    <div class="champ"><label id="lab_sigma">Volatilité </label><input id="sigma" type="number" readonly></div>
  </div>
  <div id="info"></div>
</header>

<nav>
  <button class="actif" data-p="bs">Black-Scholes</button>
  <button data-p="crr">Cox Ross Rubinstein</button>
  <button data-p="boyle">Boyle</button>
  <button data-p="cv">Control Variate</button>
  <button data-p="conv">Convergence</button>
</nav>

<main>
  <div class="panneau actif" id="p-bs">
    <div class="controles"><button class="bouton" onclick="calculer('bs')">Calculer</button></div>
  </div>

  <div class="panneau" id="p-crr">
    <div class="controles">
      <div><label>Style</label><select id="style-crr"><option value="Am">Américain</option><option value="Eu">Européen</option></select></div>
      <div><label>Pas N</label><input id="n-crr" type="number" value="100" min="1" max="2000"></div>
      <div><label>Périodes affichées</label><input id="na-crr" type="number" value="5" min="1" max="10"></div>
      <button class="bouton" onclick="calculer('arbre','crr')">Calculer</button>
    </div>
  </div>

  <div class="panneau" id="p-boyle">
    <div class="controles">
      <div><label>Style</label><select id="style-boyle"><option value="Am">Américain</option><option value="Eu">Européen</option></select></div>
      <div><label>Pas N</label><input id="n-boyle" type="number" value="100" min="1" max="2000"></div>
      <div><label>Périodes affichées</label><input id="na-boyle" type="number" value="5" min="1" max="10"></div>
      <button class="bouton" onclick="calculer('arbre','boyle')">Calculer</button>
    </div>
  </div>

  <div class="panneau" id="p-cv">
    <div class="controles">
      <div><label>Arbre testé</label><select id="model-cv"><option value="crr">CRR</option><option value="boyle">Boyle</option></select></div>
      <div><label>Pas N</label><input id="n-cv" type="number" value="100" min="1" max="2000"></div>
      <div><label>Arbre de référence</label><select id="refmodel-cv"><option value="crr">CRR</option><option value="boyle">Boyle</option></select></div>
      <div><label>Pas N référence</label><input id="nref-cv" type="number" value="2000" min="1" max="5000"></div>
      <button class="bouton" onclick="calculer('cv','cv')">Calculer</button>
    </div>
  </div>

  <div class="panneau" id="p-conv">
    <div class="controles">
      <div><label>N maximum (10 à 300)</label><input id="n-conv" type="number" value="100" min="10" max="300"></div>
      <button class="bouton" onclick="calculer('convergence')">Calculer</button>
    </div>
  </div>

  <div class="panneau" id="p-delta">
    <div class="controles">
      <div><label>Pas N</label><input id="n-delta" type="number" value="100" min="1" max="2000"></div>
      <button class="bouton" onclick="calculer('delta')">Calculer</button>
    </div>
  </div>

  <div id="sortie"></div>
</main>

<script>
  const val = id => document.getElementById(id).value;
  const poser = (id, v) => document.getElementById(id).value = v;
  const sortie = document.getElementById("sortie");
  const info = document.getElementById("info");
  let volHist = null;   // volatilité historique du ticker chargé

  async function appel(route, donnees) {
    const rep = await fetch("/api/" + route, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(donnees)
    });
    return [rep.ok, await rep.json()];
  }

  function base() {
    return {
      ticker: val("ticker"), expiration: val("expiration"), type: val("type"),
      s0: +val("s0"), k: +val("k"), t: +val("t"), r: val("r") === "" ? null : +val("r"),
      sigma: +val("sigma"), q: val("q") === "" ? 0 : +val("q")
    };
  }

  function message(texte, ok) {
    info.textContent = texte || "";
    info.className = ok ? "ok" : "";
  }

  // ---------- onglets ----------
  document.querySelectorAll("nav button").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll("nav button, .panneau").forEach(e => e.classList.remove("actif"));
      b.classList.add("actif");
      document.getElementById("p-" + b.dataset.p).classList.add("actif");
      sortie.innerHTML = "";
    };
  });

  // ---------- volatilité ----------
  function afficherVol(sigma, source) {
    poser("sigma", sigma ? sigma : "");
    document.getElementById("lab_sigma").textContent =
      "Volatilité " + (sigma ? " : " + (source.startsWith("implicite") ? "implicite" : "historique") : "");
    if (!sigma) message(source);
  }

  // ---------- marché ----------
  async function chargerTicker() {
    message("Chargement...", true);
    const [ok, d] = await appel("ticker", { ticker: val("ticker") });
    if (!ok) { message(d.erreur); return; }
    message("");

    volHist = d.vol_hist;
    poser("s0", d.spot);
    poser("k", "");
    poser("sigma", "");
    if (d.r !== null) poser("r", d.r);
    else { poser("r", ""); message("Taux introuvable : saisis r"); }
    poser("q", d.q);

    document.getElementById("expiration").innerHTML =
      d.expirations.map(e => "<option>" + e + "</option>").join("");
    changerEcheance();
  }

  function maturiteLocale(exp) {
    const auj = new Date(new Date().toDateString());
    const jours = Math.round((new Date(exp + "T00:00:00") - auj) / 86400000);
    return +(Math.max(jours, 1) / 365).toFixed(4);
  }

  function debounce(fn, ms) {
    let h;
    return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); };
  }
  const majVolDiffere = debounce(() => majVol(), 400);

  async function changerEcheance() {
    if (!val("expiration")) return;
    poser("t", maturiteLocale(val("expiration")));
    message("Chargement des strikes...", true);

    const [ok, d] = await appel("strikes", { ticker: val("ticker"), expiration: val("expiration") });
    if (!ok || !d.strikes.length) {
      message("Strikes indisponibles : " + (d.erreur || "aucun strike"));
      poser("k", ""); poser("sigma", "");
      return;
    }
    message("");
    document.getElementById("liste_strikes").innerHTML =
      d.strikes.map(s => "<option value='" + s + "'>").join("");

    // on garde K s'il existe pour cette échéance, sinon le strike le plus proche du spot
    const s0 = +val("s0"), actuel = +val("k");
    const existe = d.strikes.some(s => Math.abs(s - actuel) < 1e-6);
    const proche = d.strikes.reduce((a, b) => Math.abs(b - s0) < Math.abs(a - s0) ? b : a);
    poser("k", existe ? actuel : proche);
    majVol();
  }

  // implicite d'abord ; historique si Newton ne converge pas ou si l'appel échoue
  let jeton = 0;
  async function majVol() {
    if (!val("expiration") || !val("k")) return;
    const mon = ++jeton;
    poser("t", maturiteLocale(val("expiration")));
    const [ok, d] = await appel("vol", { ...base(), vol_hist: volHist });
    if (mon !== jeton) return;
    if (!ok) {
      if (volHist) afficherVol(volHist, "historique");
      else afficherVol(null, d.erreur);
      return;
    }
    poser("t", d.t);
    afficherVol(d.sigma, d.source);
  }

  // ---------- affichage des résultats ----------
  function carteHtml(c) {
    return '<div class="cartec ' + (c.ton || "") + '"><div class="lab">' + c.label
      + '</div><div class="val">' + c.valeur + "</div></div>";
  }

  function tableauHtml(t) {
    let h = "<h3>" + t.titre + '</h3><div class="defil"><table class="t"><thead><tr>'
      + t.entetes.map(e => "<th>" + e + "</th>").join("") + "</tr></thead><tbody>";
    t.lignes.forEach(l => {
      h += '<tr class="' + (l.ton || "") + '">' + l.cells.map(c => "<td>" + c + "</td>").join("") + "</tr>";
    });
    return h + "</tbody></table></div>";
  }

  function afficherBlocs(blocs) {
    let html = "";
    blocs.forEach(b => {
      if (b.type === "cartes") {
        html += "<h3>" + b.titre + '</h3><div class="grille">' + b.cartes.map(carteHtml).join("") + "</div>";
      } else if (b.type === "tableau") {
        html += tableauHtml(b);
      } else if (b.type === "arbre") {
        html += "<h3>" + b.titre + '</h3><div class="arbre">' + dessiner(b.niveaux, b.dates, b.crr) + "</div>";
      } else if (b.type === "convergence") {
        html += "<h3>Prix européen en fonction de N</h3>" + grapheConvergence(b);
      } else if (b.type === "smile") {
        html += "<h3>Smile de volatilité implicite · échéance " + b.echeance + "</h3>"
          + '<div class="graphe-large">' + grapheSmile(b) + "</div>";
      } else if (b.type === "info") {
        html += '<p class="info">' + b.texte + "</p>";
      }
    });
    sortie.innerHTML = html;
  }

  async function calculer(route, modele) {
    const extra = {};
    if (route === "arbre") {
      extra.model = modele; extra.style = val("style-" + modele);
      extra.n = +val("n-" + modele); extra.n_arbre = +val("na-" + modele);
    }
    if (route === "cv") {
      extra.model = val("model-cv"); extra.n = +val("n-cv");
      extra.ref_model = val("refmodel-cv"); extra.n_ref = +val("nref-cv");
    }
    if (route === "delta") extra.n = +val("n-delta");
    if (route === "convergence") extra.n = +val("n-conv");

    sortie.innerHTML = "";
    const [ok, d] = await appel(route, { ...base(), ...extra });
    if (!ok) { sortie.innerHTML = '<p class="erreur">' + d.erreur + "</p>"; return; }
    afficherBlocs(d.blocs);
  }

  // ---------- graphe du smile de volatilité ----------
  function grapheSmile(b) {
    const W = 860, H = 380, g = 74, d = 24, h = 24, bas = 62;

    const ks = b.points.map(p => p.strike);
    const ivs = b.points.map(p => p.iv * 100);

    // le point du strike choisi (K, σ) doit toujours rester dans le graphe
    const xs = ks.concat([b.k]);
    const ys = ivs.concat([b.sigma * 100]);
    const xmin = Math.min(...xs), xmax = Math.max(...xs);
    const etendue = (xmax - xmin) || 1;

    let ymin = Math.min(...ys), ymax = Math.max(...ys);
    const marge = (ymax - ymin) * 0.15 || 1;
    ymin = Math.max(ymin - marge, 0); ymax += marge;

    const X = k => g + (k - xmin) / etendue * (W - g - d);
    const Y = v => H - bas - (v - ymin) / (ymax - ymin) * (H - h - bas);

    let svg = '<svg width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" style="border:1px solid #d9e2f0;border-radius:8px">';

    // grille et graduations
    for (let i = 0; i <= 5; i++) {
      const v = ymin + (ymax - ymin) * i / 5, y = Y(v);
      svg += '<line x1="' + g + '" y1="' + y + '" x2="' + (W - d) + '" y2="' + y + '" stroke="#e3eaf5"/>'
        + '<text x="' + (g - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#5b6b86">' + v.toFixed(1) + " %</text>";
    }
    for (let i = 0; i <= 6; i++) {
      const k = xmin + etendue * i / 6;
      svg += '<text x="' + X(k) + '" y="' + (H - bas + 18) + '" text-anchor="middle" font-size="11" fill="#5b6b86">' + k.toFixed(0) + "</text>";
    }
    svg += '<text x="' + ((g + W - d) / 2) + '" y="' + (H - bas + 40) + '" text-anchor="middle" font-size="12" fill="#5b6b86">Strike K</text>'
      + '<text x="16" y="' + ((h + H - bas) / 2) + '" text-anchor="middle" font-size="12" fill="#5b6b86" transform="rotate(-90 16 ' + ((h + H - bas) / 2) + ')">Volatilité implicite</text>'
      + '<line x1="' + g + '" y1="' + (H - bas) + '" x2="' + (W - d) + '" y2="' + (H - bas) + '" stroke="#9db3d8"/>'
      + '<line x1="' + g + '" y1="' + h + '" x2="' + g + '" y2="' + (H - bas) + '" stroke="#9db3d8"/>';

    // courbe du smile
    const chemin = b.points.map((p, i) => (i ? "L" : "M") + X(p.strike) + "," + Y(p.iv * 100)).join("");
    svg += '<path d="' + chemin + '" fill="none" stroke="#0b2a5b" stroke-width="2.2"/>';
    b.points.forEach(p => {
      svg += '<circle cx="' + X(p.strike) + '" cy="' + Y(p.iv * 100) + '" r="3.5" fill="#0b2a5b">'
        + "<title>K = " + p.strike + " · vol implicite " + (p.iv * 100).toFixed(2) + " %</title></circle>";
    });

    // intersection de K et σ : point rouge relié aux deux axes par des pointillés
    const xk = X(b.k), yk = Y(b.sigma * 100);
    svg += '<line x1="' + xk + '" y1="' + yk + '" x2="' + xk + '" y2="' + (H - bas) + '" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>'
      + '<line x1="' + g + '" y1="' + yk + '" x2="' + xk + '" y2="' + yk + '" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>'
      + '<circle cx="' + xk + '" cy="' + yk + '" r="6.5" fill="#c0392b" stroke="white" stroke-width="2">'
      + "<title>Strike choisi : K = " + b.k + " · σ = " + (b.sigma * 100).toFixed(2) + " %</title></circle>";

    return svg + "</svg>";
  }

  // ---------- graphe de convergence ----------
  function grapheConvergence(b) {
    const W = 860, H = 400, g = 74, d = 24, h = 24, bas = 54;
    const tous = b.crr.concat(b.boyle).filter(v => v !== null).concat([b.bs]);
    let ymin = Math.min(...tous), ymax = Math.max(...tous);
    const marge = (ymax - ymin) * 0.12 || 0.01;
    ymin -= marge; ymax += marge;
    const n0 = b.ns[0], n1 = b.ns[b.ns.length - 1];
    const X = n => g + (n - n0) / (n1 - n0) * (W - g - d);
    const Y = v => H - bas - (v - ymin) / (ymax - ymin) * (H - h - bas);
    const dec = (ymax - ymin) < 0.1 ? 4 : (ymax - ymin) < 1 ? 3 : 2;

    let svg = '<svg width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" style="border:1px solid #d9e2f0;border-radius:8px">';

    // grille et graduations
    for (let i = 0; i <= 5; i++) {
      const v = ymin + (ymax - ymin) * i / 5, y = Y(v);
      svg += '<line x1="' + g + '" y1="' + y + '" x2="' + (W - d) + '" y2="' + y + '" stroke="#e3eaf5"/>'
        + '<text x="' + (g - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#5b6b86">' + v.toFixed(dec) + "</text>";
    }
    for (let i = 0; i <= 6; i++) {
      const n = Math.round(n0 + (n1 - n0) * i / 6);
      svg += '<text x="' + X(n) + '" y="' + (H - bas + 18) + '" text-anchor="middle" font-size="11" fill="#5b6b86">' + n + "</text>";
    }
    svg += '<text x="' + ((g + W - d) / 2) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="12" fill="#5b6b86">N (nombre de pas)</text>'
      + '<line x1="' + g + '" y1="' + (H - bas) + '" x2="' + (W - d) + '" y2="' + (H - bas) + '" stroke="#9db3d8"/>'
      + '<line x1="' + g + '" y1="' + h + '" x2="' + g + '" y2="' + (H - bas) + '" stroke="#9db3d8"/>';

    // Black-Scholes
    svg += '<line x1="' + g + '" y1="' + Y(b.bs) + '" x2="' + (W - d) + '" y2="' + Y(b.bs)
      + '" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>';

    // courbes (les points manquants interrompent le trait)
    function courbe(valeurs, couleur) {
      let chemin = "", ouvert = false;
      valeurs.forEach((v, i) => {
        if (v === null) { ouvert = false; return; }
        chemin += (ouvert ? "L" : "M") + X(b.ns[i]) + "," + Y(v);
        ouvert = true;
      });
      return '<path d="' + chemin + '" fill="none" stroke="' + couleur + '" stroke-width="2"/>';
    }
    svg += courbe(b.crr, "#0b2a5b") + courbe(b.boyle, "#e08a00");

    // légende
    const lx = W - d - 190;
    [["CRR", "#0b2a5b", ""], ["Boyle", "#e08a00", ""], ["Black-Scholes", "#c0392b", "7 5"]].forEach((e, i) => {
      const y = h + 14 + i * 20;
      svg += '<line x1="' + lx + '" y1="' + y + '" x2="' + (lx + 28) + '" y2="' + y + '" stroke="' + e[1]
        + '" stroke-width="2.5"' + (e[2] ? ' stroke-dasharray="' + e[2] + '"' : "") + "/>"
        + '<text x="' + (lx + 36) + '" y="' + (y + 4) + '" font-size="12" fill="#14223b">' + e[0] + "</text>";
    });
    return svg + "</svg>";
  }

  // ---------- dessin de l'arbre ----------
  function dessiner(niveaux, dates, crr) {
    const P = niveaux.length - 1;
    const dx = 125, dy = crr ? 50 : 46, l = 90, h = 38, marge = 20, haut = 46;
    const largeur = P * dx + l + 2 * marge;
    const contenu = (crr ? P : 2 * P) * dy + h;
    const hauteur = contenu + haut + marge;
    const centre = haut + contenu / 2;
    const X = i => marge + i * dx;
    const Y = (i, j) => centre + (crr ? (i / 2 - j) : (i - j)) * dy;

    let svg = '<svg width="' + largeur + '" height="' + hauteur + '" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">';

    niveaux.forEach((_, i) => {
      svg += '<text x="' + (X(i) + l / 2) + '" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#0b2a5b">i = ' + i + "</text>"
        + '<text x="' + (X(i) + l / 2) + '" y="33" text-anchor="middle" font-size="10" fill="#5b6b86">' + dates[i] + "</text>";
    });

    niveaux.forEach((niveau, i) => {
      if (i === P) return;
      niveau.forEach((_, j) => {
        const enfants = crr ? [j, j + 1] : [j, j + 1, j + 2];
        enfants.forEach(c => {
          svg += '<line x1="' + (X(i) + l) + '" y1="' + Y(i, j) + '" x2="' + X(i + 1) + '" y2="' + Y(i + 1, c)
            + '" stroke="#9db3d8" stroke-width="1.2"/>';
        });
      });
    });

    niveaux.forEach((niveau, i) => {
      niveau.forEach((n, j) => {
        const fond = n.ex ? "#0b2a5b" : "none";
        const texte = n.ex ? "#ffffff" : "#0b2a5b";
        const x = X(i), y = Y(i, j);
        svg += '<rect x="' + x + '" y="' + (y - h / 2) + '" width="' + l + '" height="' + h
          + '" rx="6" fill="' + fond + '" stroke="#0b2a5b" stroke-width="' + (n.ex ? 3 : 1.5) + '"/>'
          + '<text x="' + (x + l / 2) + '" y="' + (y - 3) + '" text-anchor="middle" font-size="11" fill="' + texte + '">S ' + n.s.toFixed(2) + "</text>"
          + '<text x="' + (x + l / 2) + '" y="' + (y + 12) + '" text-anchor="middle" font-size="12" font-weight="700" fill="' + texte + '">V ' + n.v.toFixed(2) + "</text>";
      });
    });

    return svg + "</svg>";
  }
</script>
